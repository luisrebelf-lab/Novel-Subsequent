<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
#myDIV {
  width: 99%;
  padding: 10px 0;
  padding-left:10px;
  text-align: left;
  margin-bottom:10px;

}
.diobox {
width: 100%;
  border-style: dashed;
  border-width:1px;
  padding-top: 5px;
  padding-bottom: 5px;
margin-bottom:10px;
}
button {
margin:auto;

}
.center {
 display: flex;
  justify-content: center; /* Horizontal centering */
  align-items: center;     /* Vertical centering */
}
</style>
</head>
<body>

<p>Click the "Try it" button to toggle between hiding and showing the DIV element:</p>
<div class="diobox">
<div class="center">
<button onclick="myFunction()">Hide Pesterlog</button>
</div>
<div id="myDIV">
This is my DIV element.
</div>
</div>
<textarea style="width: 100%;" rows="8" readonly=""></textarea>
<p><b>Note:</b> The element will not take up any space when the display property 
is set to "none".</p>

<script>
function myFunction() {
  var x = document.getElementById("myDIV");
  if (x.style.display === "none") {
    x.style.display = "block";
  } else {
    x.style.display = "none";
  }
}
</script>

</body>
</html>
